<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excellence Online College Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<style>
  :root{--green:#0f4c3a;--navy:#14213d;--ink:#0b1530;--gold:#e0b44c;--bg:#f3f5f8;--line:#d9dee7;--text:#1b2433;--muted:#5b6679;--red:#b3261e;
    --serif:"Source Serif 4",Georgia,serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
  .hide{display:none!important}
  button,input,select{font:inherit}
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* login */
  #login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
  .side{padding:clamp(32px,6vw,80px);display:flex;flex-direction:column;justify-content:center;gap:16px;background:var(--green);color:#e7f2ec}
  .side h1{font-family:var(--serif);font-size:clamp(2rem,4vw,3.2rem);line-height:1.1;color:#fff}
  .side p{max-width:36ch;line-height:1.55;opacity:.92}
  .crest{width:44px;height:44px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:22px}
  .formwrap{background:var(--navy);display:flex;align-items:center;justify-content:center;padding:32px}
  .card{background:#fff;border-radius:10px;padding:32px;width:100%;max-width:400px;display:grid;gap:14px}
  .card h2{font-family:var(--serif);font-size:1.6rem}
  label{font-size:.9rem;font-weight:600;display:grid;gap:6px}
  input,select{padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);width:100%}
  .btn{background:var(--navy);color:#fff;border:2px solid var(--navy);padding:12px 18px;border-radius:6px;font-weight:600;cursor:pointer}
  .btn:hover{background:#fff;color:var(--navy)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
  .btn.gold:hover{background:#fff}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .link{background:none;border:0;color:var(--navy);text-decoration:underline;cursor:pointer;justify-self:start;padding:0}
  .msg{font-size:.9rem;padding:10px 12px;border-radius:6px;background:#fdecea;color:var(--red)}
  .msg.ok{background:#e6f4ec;color:var(--green)}

  /* app shell */
  #app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  nav{background:var(--ink);color:#cfd7e6;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
  nav .brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--serif);font-weight:700;padding:4px 8px 16px;border-bottom:1px solid #243153;margin-bottom:10px}
  nav .crest{width:32px;height:32px;font-size:16px}
  nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}
  nav button:hover{background:#17224a}
  nav button[aria-current="page"]{background:var(--gold);color:#1a1a1a;font-weight:600}
  nav .spacer{flex:1}
  .who{font-size:.8rem;padding:8px 12px;color:#9fb0d0;word-break:break-all}
  main{padding:clamp(18px,3vw,36px);overflow-x:auto}
  main h1{font-family:var(--serif);font-size:1.8rem;margin-bottom:4px}
  .sub{color:var(--muted);margin-bottom:20px}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--gold);padding:16px;border-radius:8px}
  .stat b{display:block;font-family:var(--serif);font-size:1.5rem}
  .stat span{color:var(--muted);font-size:.9rem}
  .tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .tools input{max-width:320px}
  .tablewrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:.9rem}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
  th{background:#eef1f6;font-weight:600}
  tr:last-child td{border-bottom:0}
  .pager{display:flex;gap:10px;align-items:center;margin-top:12px;color:var(--muted);font-size:.9rem}
  .pager .btn{padding:6px 12px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;margin-bottom:20px}
  .panel h2{font-family:var(--serif);font-size:1.25rem;margin-bottom:12px}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px}
  dt{color:var(--muted)}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  @media(max-width:800px){
    #login{grid-template-columns:1fr}
    .side{padding:36px 24px}
    #app{grid-template-columns:1fr}
    nav{flex-direction:row;flex-wrap:wrap;align-items:center}
    nav .brand{border:0;margin:0;padding:4px 8px}
    nav .spacer,.who{display:none}
  }
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div id="login">
  <section class="side">
    <div class="crest" aria-hidden="true">E</div>
    <h1>Excellence Online College</h1>
    <p>One sign in for students and staff. Students see their own classes and fees. Staff manage the college.</p>
  </section>
  <section class="formwrap">
    <form class="card" id="loginForm">
      <h2 id="formTitle">Sign in</h2>
      <div id="setupMsg" class="msg hide"></div>
      <label>Email<input type="email" id="email" autocomplete="username" required></label>
      <label id="pwLabel">Password<input type="password" id="password" autocomplete="current-password" required></label>
      <div id="loginMsg" class="msg hide" role="alert"></div>
      <button class="btn" id="loginBtn" type="submit">Sign in</button>
      <button class="link" id="forgotBtn" type="button">Forgot password?</button>
    </form>
  </section>
</div>

<!-- ========== APP ========== -->
<div id="app" class="hide">
  <nav aria-label="Main">
    <div class="brand"><div class="crest" aria-hidden="true">E</div>Excellence</div>
    <div id="menu" style="display:contents"></div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button id="logoutBtn">Sign out</button>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<script>
/* ================================================================
   SETTINGS: paste your Supabase anon (public) key below.
   Find it in Supabase → Project Settings → API → "anon public".
   NEVER paste the service_role key here.
   ================================================================ */
const SUPABASE_URL = "https://rusiuzlqkvogwsocudnk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1c2l1emxxa3ZvZ3dzb2N1ZG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjgxMDgsImV4cCI6MjA5OTkwNDEwOH0.RpdmWwyH700ZElW8btDL1Jf_ymDGqj9Hq2Eix4gLm44";

const STAFF_ROLES = ["admin", "staff", "teacher"];
const STAFF_TABLES = {
  admin:   ["students","programs","courses","enrollments","attendance","fee_payments"],
  staff:   ["students","programs","courses","enrollments","attendance","fee_payments"],
  teacher: ["courses","enrollments","attendance"]
};
const LABELS = {students:"Students",programs:"Programs",courses:"Courses",enrollments:"Enrollments",attendance:"Attendance",fee_payments:"Fees"};
const PAGE = 25;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nice = k => k.replace(/_/g," ").replace(/^./, c => c.toUpperCase());
const fmtMoney = n => "KES " + Number(n || 0).toLocaleString("en-KE");

let db, session, profile, role, student;

const configured = SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith("PASTE");
if (!configured) {
  const m = $("setupMsg");
  m.textContent = "Setup needed: open index.html and paste your Supabase anon key where it says eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1c2l1emxxa3ZvZ3dzb2N1ZG5rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMjgxMDgsImV4cCI6MjA5OTkwNDEwOH0.RpdmWwyH700ZElW8btDL1Jf_ymDGqj9Hq2Eix4gLm44.";
  m.classList.remove("hide");
  $("loginBtn").disabled = true;
} else {
  db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  boot();
}

function showMsg(el, text, ok) {
  el.textContent = text; el.classList.toggle("ok", !!ok); el.classList.remove("hide");
}

/* ---------- auth ---------- */
let resetMode = false;
$("forgotBtn").onclick = () => {
  resetMode = !resetMode;
  $("pwLabel").classList.toggle("hide", resetMode);
  $("password").required = !resetMode;
  $("formTitle").textContent = resetMode ? "Reset password" : "Sign in";
  $("loginBtn").textContent = resetMode ? "Send reset link" : "Sign in";
  $("forgotBtn").textContent = resetMode ? "Back to sign in" : "Forgot password?";
  $("loginMsg").classList.add("hide");
};

$("loginForm").onsubmit = async e => {
  e.preventDefault();
  if (!db) return;
  const btn = $("loginBtn"); btn.disabled = true;
  $("loginMsg").classList.add("hide");
  const email = $("email").value.trim();
  try {
    if (resetMode) {
      const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
      if (error) throw error;
      showMsg($("loginMsg"), "Check your email for a reset link.", true);
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password: $("password").value });
      if (error) throw error;
      await boot();
    }
  } catch (err) {
    showMsg($("loginMsg"), err.message || "Could not sign in. Check your email and password and try again.");
  } finally { btn.disabled = false; }
};

$("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  session = profile = student = role = null;
  $("app").classList.add("hide"); $("login").classList.remove("hide");
  $("password").value = "";
};

async function boot() {
  const { data } = await db.auth.getSession();
  session = data.session;
  if (!session) return;
  if (location.hash.includes("type=recovery")) {
    const np = prompt("Enter a new password (at least 6 characters):");
    if (np && np.length >= 6) {
      const { error } = await db.auth.updateUser({ password: np });
      alert(error ? error.message : "Password updated.");
    }
    history.replaceState(null, "", location.pathname);
  }
  const { data: p } = await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  profile = p;
  role = (p && p.role) ? String(p.role).toLowerCase() : "student";
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("who").textContent = ((p && (p.full_name || p.name)) || session.user.email) + " · " + role;
  if (STAFF_ROLES.includes(role)) staffHome(); else await studentHome();
}

/* ---------- menu ---------- */
function setMenu(items, active) {
  $("menu").innerHTML = items.map(([key, label]) =>
    `<button data-k="${key}" ${key === active ? 'aria-current="page"' : ""}>${esc(label)}</button>`).join("");
  $("menu").querySelectorAll("button").forEach(b => b.onclick = () => items.find(i => i[0] === b.dataset.k)[2]());
}

/* ---------- data helpers ---------- */
async function fetchRows(table, build) {
  let q = db.from(table).select("*");
  if (build) q = build(q);
  let r = await q.order("created_at", { ascending: false }).limit(1000);
  if (r.error) { // table may have no created_at column
    q = db.from(table).select("*"); if (build) q = build(q);
    r = await q.limit(1000);
  }
  return r;
}

function renderTable(rows) {
  if (!rows.length) return `<div class="empty">No records to show.</div>`;
  const cols = Object.keys(rows[0]).filter(k => !/^(created_at|updated_at)$/.test(k));
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(nice(c))}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(r => `<tr>${cols.map(c => {
      let v = r[c]; if (v && typeof v === "object") v = JSON.stringify(v);
      return `<td title="${esc(v)}">${esc(v)}</td>`;
    }).join("")}</tr>`).join("") + `</tbody></table></div>`;
}

function toCSV(rows) {
  if (!rows.length) return "";
  const cols = Object.keys(rows[0]);
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  return [cols.map(q).join(","), ...rows.map(r => cols.map(c => q(r[c] && typeof r[c] === "object" ? JSON.stringify(r[c]) : r[c])).join(","))].join("\n");
}

/* ---------- staff ---------- */
function staffMenu(active) {
  const tables = STAFF_TABLES[role] || STAFF_TABLES.teacher;
  setMenu([["home", "Dashboard", staffHome], ...tables.map(t => [t, LABELS[t], () => staffTable(t)])], active);
  return tables;
}

function staffHome() {
  const tables = staffMenu("home");
  $("main").innerHTML = `<h1>Dashboard</h1><p class="sub">Overview of the college.</p><div class="stats" id="stats"></div><div id="feeBox"></div>`;
  tables.forEach(async t => {
    const { count, error } = await db.from(t).select("*", { count: "exact", head: true });
    const el = document.createElement("div"); el.className = "stat";
    el.innerHTML = `<b>${error ? "–" : count}</b><span>${esc(LABELS[t])}</span>`;
    $("stats")?.appendChild(el);
  });
  if (tables.includes("fee_payments")) feeSummary();
}

async function feeSummary() {
  const { data, error } = await db.from("fee_payments").select("*").limit(5000);
  if (error || !data || !data.length) return;
  if (!("amount" in data[0]) || !("amount_paid" in data[0])) return;
  const billed = data.reduce((s, r) => s + Number(r.amount || 0), 0);
  const paid = data.reduce((s, r) => s + Number(r.amount_paid || 0), 0);
  if ($("feeBox")) $("feeBox").innerHTML = `<div class="panel"><h2>Fees</h2><div class="stats" style="margin:0">
    <div class="stat"><b>${fmtMoney(billed)}</b><span>Billed</span></div>
    <div class="stat"><b>${fmtMoney(paid)}</b><span>Collected</span></div>
    <div class="stat"><b>${fmtMoney(billed - paid)}</b><span>Pending</span></div></div></div>`;
}

async function staffTable(table) {
  staffMenu(table);
  const main = $("main");
  main.innerHTML = `<h1>${esc(LABELS[table])}</h1><p class="sub">Loading…</p>`;
  const { data, error } = await fetchRows(table);
  if (error) { main.innerHTML = `<h1>${esc(LABELS[table])}</h1><div class="msg">${esc(error.message)}</div>`; return; }
  const rows = data || [];
  main.innerHTML = `<h1>${esc(LABELS[table])}</h1><p class="sub">${rows.length} record${rows.length === 1 ? "" : "s"} (latest 1,000)</p>
    <div class="tools"><input id="q" type="search" placeholder="Search…" aria-label="Search"><button class="btn gold" id="csv">Download CSV</button></div>
    <div id="tbl"></div><div class="pager" id="pager"></div>`;
  let page = 0, filtered = rows;
  const draw = () => {
    const pages = Math.max(1, Math.ceil(filtered.length / PAGE));
    page = Math.min(page, pages - 1);
    $("tbl").innerHTML = renderTable(filtered.slice(page * PAGE, page * PAGE + PAGE));
    $("pager").innerHTML = `<button class="btn" id="prev" ${page === 0 ? "disabled" : ""}>Previous</button>
      <span>Page ${page + 1} of ${pages}</span><button class="btn" id="next" ${page >= pages - 1 ? "disabled" : ""}>Next</button>`;
    $("prev").onclick = () => { page--; draw(); }; $("next").onclick = () => { page++; draw(); };
  };
  $("q").oninput = e => {
    const s = e.target.value.toLowerCase();
    filtered = s ? rows.filter(r => JSON.stringify(r).toLowerCase().includes(s)) : rows; page = 0; draw();
  };
  $("csv").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([toCSV(filtered)], { type: "text/csv" }));
    a.download = table + ".csv"; a.click();
  };
  draw();
}

/* ---------- student ---------- */
async function findStudent() {
  const uid = session.user.id, email = session.user.email;
  for (const [col, val] of [["profile_id", uid], ["user_id", uid], ["email", email]]) {
    const { data, error } = await db.from("students").select("*").eq(col, val).limit(1);
    if (!error && data && data.length) return data[0];
  }
  return null;
}

async function studentHome() {
  setMenu([["me", "My records", studentHome]], "me");
  const main = $("main");
  main.innerHTML = `<h1>My records</h1><p class="sub">Loading…</p>`;
  student = await findStudent();
  if (!student) {
    main.innerHTML = `<h1>My records</h1><div class="panel"><p>You are signed in as ${esc(session.user.email)}, but no student record is linked to this account yet. Please contact the admissions office.</p></div>`;
    return;
  }
  const hidden = /^(id|created_at|updated_at|profile_id|user_id)$/;
  const details = Object.entries(student).filter(([k, v]) => !hidden.test(k) && v !== null && typeof v !== "object")
    .map(([k, v]) => `<dt>${esc(nice(k))}</dt><dd>${esc(v)}</dd>`).join("");
  const [enr, fees] = await Promise.all([
    fetchRows("enrollments", q => q.eq("student_id", student.id)),
    fetchRows("fee_payments", q => q.eq("student_id", student.id))
  ]);
  const enrRows = enr.data || [], feeRows = fees.data || [];
  let att = [];
  if (enrRows.length) {
    const r = await fetchRows("attendance", q => q.in("enrollment_id", enrRows.map(e => e.id)));
    att = r.data || [];
  }
  let feeStats = "";
  if (feeRows.length && "amount" in feeRows[0] && "amount_paid" in feeRows[0]) {
    const billed = feeRows.reduce((s, r) => s + Number(r.amount || 0), 0);
    const paid = feeRows.reduce((s, r) => s + Number(r.amount_paid || 0), 0);
    feeStats = `<div class="stats"><div class="stat"><b>${fmtMoney(billed)}</b><span>Billed</span></div>
      <div class="stat"><b>${fmtMoney(paid)}</b><span>Paid</span></div>
      <div class="stat"><b>${fmtMoney(billed - paid)}</b><span>Balance</span></div></div>`;
  }
  main.innerHTML = `<h1>My records</h1><p class="sub">Your details, classes, fees and attendance.</p>
    <div class="panel"><h2>My details</h2><dl>${details}</dl></div>
    <div class="panel"><h2>My classes</h2>${renderTable(enrRows)}</div>
    <div class="panel"><h2>My fees</h2>${feeStats}${renderTable(feeRows)}</div>
    <div class="panel"><h2>My attendance</h2>${renderTable(att)}</div>`;
}
</script>
</body>
</html>
